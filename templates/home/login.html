 
{% extends 'home/base.html' %}

{% block title %}Login | CodeVault{% endblock %}

{% block body %}
<style>
    
.auth-page {
    min-height: 85vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 45px 18px;
    background:
        linear-gradient(rgba(5, 10, 25, 0.48), rgba(5, 10, 25, 0.65)),
        url("/static/images/pngtree-notebook-computer-electronic-equipment-science-and-technology-particles-picture-image_1677481.jpg")        
        center center / cover no-repeat;
        border-radius: 18px;
}

    .auth-card {
        width: 100%;
        max-width: 440px;
        padding: 38px;
        color: #f8fafc;
        background: rgba(20, 28, 50, 0.92);
        border: 1px solid rgba(148, 163, 184, 0.22);
        border-radius: 22px;
        box-shadow: 0 25px 70px rgba(0, 0, 0, 0.35);
    }

    .auth-logo {
        width: 190px;
        height: 64px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 18px;
        border-radius: 18px;
        background: linear-gradient(135deg, #3b82f6, #8b5cf6);
        font-size: 30px;
        font-weight: 800;
        box-shadow: 0 8px 25px rgba(99, 102, 241, 0.3);
    }

    .auth-card h2 {
        font-size: 29px;
        font-weight: 750;
        text-align: center;
        margin-bottom: 8px;
    }

    .auth-subtitle {
        color: #aab5cc;
        text-align: center;
        margin-bottom: 30px;
        font-size: 14px;
    }

    .auth-card .form-label {
        color: #dce5f5;
        font-size: 14px;
        font-weight: 600;
        margin-bottom: 8px;
    }

    .auth-card .form-control {
        padding: 13px 14px;
        color: #f8fafc;
        background: #111a2e;
        border: 1px solid #34415d;
        border-radius: 11px;
    }

    .auth-card .form-control::placeholder {
        color: #8290aa;
    }

    .auth-card .form-control:focus {
        background: #111a2e;
        color: #fff;
        border-color: #818cf8;
        box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.17);
    }

    .auth-btn {
        width: 100%;
        padding: 13px;
        margin-top: 8px;
        color: #fff;
        font-weight: 700;
        border: none;
        border-radius: 11px;
        background: linear-gradient(100deg, #3b82f6, #8b5cf6);
        transition: transform 0.2s, box-shadow 0.2s;
    }

    .auth-btn:hover {
        color: #fff;
        transform: translateY(-2px);
        box-shadow: 0 9px 24px rgba(99, 102, 241, 0.3);
    }

    .auth-footer {
        color: #aab5cc;
        text-align: center;
        margin: 25px 0 0;
        font-size: 14px;
    }

    .auth-footer a {
        color: #a5b4fc;
        font-weight: 700;
        text-decoration: none;
    }

    .auth-footer a:hover {
        color: #c4b5fd;
        text-decoration: underline;
    }

    @media (max-width: 480px) {
        .auth-card {
            padding: 28px 22px;
        }

        .auth-card h2 {
            font-size: 25px;
        }
    }
</style>

<div class="auth-page">
    <div class="auth-card">
        <div class="auth-logo">CodeVault</div>

        <h2>Welcome Back</h2>
        <p class="auth-subtitle">
            Sign in to continue your CodeVault journey.
        </p>

        {% if error %}
            <div class="alert alert-danger" role="alert">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}

            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input
                    type="text"
                    name="username"
                    id="username"
                    class="form-control"
                    placeholder="Enter your username"
                    autocomplete="username"
                    required
                >
            </div>

            <div class="mb-4">
                <label for="password" class="form-label">Password</label>
                <input
                    type="password"
                    name="password"
                    id="password"
                    class="form-control"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" class="auth-btn">
                Sign In &rarr;
            </button>
        </form>

        <p class="auth-footer">
            New to CodeVault?
            <a href="{% url 'signup' %}">Create an account</a>
        </p>
    </div>
</div>
{% endblock %}
